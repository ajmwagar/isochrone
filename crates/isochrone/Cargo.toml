[package]
name = "isochrone"
description = "Low-latency RTP audio transport for independent hardware clock domains."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
isochrone-asrc = { path = "../isochrone-asrc" }
isochrone-core = { path = "../isochrone-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
hound = "3.5.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "isochrone-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "isochronectl"
path = "src/bin/ctl.rs"
