[package]
name = "isochrone"
description = "Low-latency RTP audio transport for independent hardware clock domains."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
isochrone-asrc = { path = "../isochrone-asrc" }
isochrone-core = { path = "../isochrone-core" }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
hound = "3.5.1"
