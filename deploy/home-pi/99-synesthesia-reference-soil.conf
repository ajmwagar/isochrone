# Soil remote mix into the Synesthesia console.
# Requires a `reference-soil` interface and
# `reference-soil-left/right` audio sources in the Synesthesia graph.

pcm.reference_soil_jack {
    type jack
    playback_ports {
        0 "synesthesia:reference_soil_1"
        1 "synesthesia:reference_soil_2"
    }
    hint.show off
}

pcm.reference_soil {
    type plug
    slave.pcm "reference_soil_jack"
    hint {
        show on
        description "Synesthesia Soil remote mix input"
    }
}
