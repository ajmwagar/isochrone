pcm.hardware_dmixer {
    type dmix
    ipc_key 1024
    # One shared writer contract for the Scarlett 2i2. The 2ms period and
    # 20ms buffer retain scheduler headroom without hiding a quarter-second
    # delay inside the device boundary.
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:Gen,0"
        rate 48000
        format S32_LE
        period_size 96
        buffer_size 960
    }
}

# Compatibility name for clients deployed before the low-latency contract.
pcm.delayed_output {
    type plug
    slave.pcm "hardware_dmixer"
}

pcm.visualizer_sink {
    type dmix
    ipc_key 1025
    # Music and JARVIS share the pre-visualization loopback without making
    # its historical 500ms buffer part of every live audio path.
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,0"
        rate 48000
        format S32_LE
        channels 2
        period_size 96
        buffer_size 960
    }
}

pcm.jarvis_duck {
    type softvol
    slave.pcm "visualizer_sink"
    control {
        name "JARVIS Duck"
        card Loopback
    }
    min_dB -50.0
    max_dB 0.0
    resolution 101
}

pcm.jarvis_tts {
    type plug
    slave.pcm "visualizer_sink"
}

pcm.visualizer_dsnoop {
    type dsnoop
    ipc_key 1026
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,1,0"
        rate 48000
        format S32_LE
        channels 2
        period_size 96
        buffer_size 960
    }
}

pcm.visualizer_capture {
    type plug
    slave.pcm "visualizer_dsnoop"
    hint {
        show on
        description "Canvas pre-output monitor"
    }
}

pcm.!default {
    type plug
    slave.pcm "jarvis_duck"
}
